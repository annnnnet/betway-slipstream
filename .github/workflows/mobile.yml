name: Android APK → Firebase App Distribution

# Built in CI rather than on a laptop. The Android toolchain (Flutter SDK,
# JDK, Android SDK, build-tools) is ~5GB of setup that produces a build nobody
# can reproduce; a runner installs it from scratch every time, so the APK a
# tester receives is always built from a known-clean state at a known commit.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API origin to compile in. Overrides the API_URL repo variable. Use your LAN IP (http://192.168.x.x:4000) to test against a laptop before the API is deployed.'
        required: false
      release_notes:
        description: 'Release notes shown to testers'
        required: false
        default: 'Manual build'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # apps/mobile holds only pubspec.yaml, lib/ and test/ — the generated
      # android/ tree is not committed, because it is 40+ files of boilerplate
      # that no human edits and that `flutter create` reproduces exactly.
      # Generating it into a scratch directory and copying it in keeps our own
      # lib/main.dart safe from being overwritten by the counter-app template.
      - name: Generate the Android platform scaffolding
        run: |
          flutter create --org com.slipstream --project-name slipstream \
            --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The API origin is compiled in, so a build cannot silently ship
      # pointing somewhere unintended. Resolve it once here.
      #
      # Failing loudly on an empty value matters more than it looks:
      # `--dart-define=API_URL=` sets the key to an empty *string*, which
      # counts as "defined", so Dart's `String.fromEnvironment` default never
      # applies. The APK would install, launch, and fail every request against
      # an empty origin — a broken app that looks like a broken API.
      - name: Resolve the API origin
        run: |
          API_URL="${{ github.event.inputs.api_url || vars.API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::No API origin. Set the API_URL repository variable, or pass api_url when running this workflow manually."
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Building against $API_URL"

      # Android has blocked cleartext HTTP by default since API 28, so an APK
      # built against a plain-http origin — which is what testing against a
      # laptop on the same wifi means — fails every request with a bare
      # SocketException and no hint as to why. Opt in only for those builds;
      # a real https origin never gets the exemption.
      - name: Allow cleartext traffic (http origins only)
        if: ${{ startsWith(env.API_URL, 'http://') }}
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' \
            android/app/src/main/AndroidManifest.xml
          echo "::warning::Cleartext HTTP enabled because API_URL is not https. Do not distribute this build to testers."

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_URL=$API_URL

      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      # Distribution is skipped rather than failed when the secret is absent,
      # so a fork or a first push still gets a green build and a downloadable
      # artifact instead of a red X for a credential it was never given.
      - name: Distribute to testers
        if: ${{ env.FIREBASE_APP_ID != '' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          releaseNotes: ${{ github.event.inputs.release_notes || github.event.head_commit.message }}
          file: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
