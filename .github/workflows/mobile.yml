name: Android APK → Firebase App Distribution

# Built in CI rather than on a laptop. The Android toolchain (Flutter SDK,
# JDK, Android SDK, build-tools) is ~5GB of setup that produces a build nobody
# can reproduce; a runner installs it from scratch every time, so the APK a
# tester receives is always built from a known-clean state at a known commit.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API origin to compile in. Overrides the API_URL repo variable. Use your LAN IP (http://192.168.x.x:4000) to test against a laptop before the API is deployed.'
        required: false
      testers:
        description: 'Comma-separated tester emails to invite for this build. Adds to the FIREBASE_TESTERS variable rather than replacing it.'
        required: false
      release_notes:
        description: 'Release notes shown to testers'
        required: false
        default: 'Manual build'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    # Lifted to the job so the distribution step can test it in its own `if:`.
    # A step's own `env:` block is not reliably visible to that step's `if:`,
    # and the `secrets` context is not permitted there at all — using it makes
    # the whole workflow fail validation, which is how this was found.
    env:
      # The Firebase App ID is a public identifier — it ships inside every APK
      # in google-services.json — so it lives in a variable, not a secret. Only
      # the service-account JSON is genuinely sensitive.
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # apps/mobile holds only pubspec.yaml, lib/ and test/ — the generated
      # android/ tree is not committed, because it is 40+ files of boilerplate
      # that no human edits and that `flutter create` reproduces exactly.
      # Generating it into a scratch directory and copying it in keeps our own
      # lib/main.dart safe from being overwritten by the counter-app template.
      - name: Generate the Android platform scaffolding
        run: |
          flutter create --org com.slipstream --project-name slipstream \
            --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The API origin is compiled in, so a build cannot silently ship
      # pointing somewhere unintended. Resolve it once here.
      #
      # Failing loudly on an empty value matters more than it looks:
      # `--dart-define=API_URL=` sets the key to an empty *string*, which
      # counts as "defined", so Dart's `String.fromEnvironment` default never
      # applies. The APK would install, launch, and fail every request against
      # an empty origin — a broken app that looks like a broken API.
      - name: Resolve the API origin
        run: |
          API_URL="${{ github.event.inputs.api_url || vars.API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::No API origin. Set the API_URL repository variable, or pass api_url when running this workflow manually."
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Building against $API_URL"

      # Android has blocked cleartext HTTP by default since API 28, so an APK
      # built against a plain-http origin — which is what testing against a
      # laptop on the same wifi means — fails every request with a bare
      # SocketException and no hint as to why. Opt in only for those builds;
      # a real https origin never gets the exemption.
      - name: Allow cleartext traffic (http origins only)
        if: ${{ startsWith(env.API_URL, 'http://') }}
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' \
            android/app/src/main/AndroidManifest.xml
          echo "::warning::Cleartext HTTP enabled because API_URL is not https. Do not distribute this build to testers."

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_URL=$API_URL

      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      # Skipped rather than failed when no credentials are configured, so a
      # fork or a first push still gets a green build and a downloadable APK
      # instead of a red X for a credential it was never given.
      # FIREBASE_APP_ID comes from the job-level env above — see the note there.
      # The distribution action reports every credential problem as "Failed to
      # authenticate, have you run firebase login?", which is unhelpful when
      # the real cause is a truncated paste, a base64-wrapped key, or a service
      # account missing the App Distribution Admin role. Check the shape here
      # so the log says which of those it is. Nothing secret is printed.
      - name: Check the service-account credentials
        if: ${{ env.FIREBASE_APP_ID != '' }}
        env:
          CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CREDS" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is empty. Add the service-account JSON as a repository secret."
            exit 1
          fi
          node -e '
            const raw = process.env.CREDS;
            let creds;
            try { creds = JSON.parse(raw); }
            catch {
              console.log("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the whole downloaded key file, unmodified and not base64-encoded.");
              process.exit(1);
            }
            const missing = ["type", "project_id", "private_key", "client_email"].filter((k) => !creds[k]);
            if (missing.length) {
              console.log(`::error::FIREBASE_SERVICE_ACCOUNT is missing: ${missing.join(", ")}. That is not a service-account key file.`);
              process.exit(1);
            }
            if (creds.type !== "service_account") {
              console.log(`::error::FIREBASE_SERVICE_ACCOUNT has type "${creds.type}", expected "service_account".`);
              process.exit(1);
            }
            // Safe to print: the account address is an identifier, not a credential.
            console.log(`Service account ${creds.client_email} on project ${creds.project_id}`);
            console.log("::notice::If upload still fails to authenticate, grant this account the \"Firebase App Distribution Admin\" role in Google Cloud IAM.");
          '

      # Individual emails rather than a group, so inviting an external
      # reviewer costs one workflow input instead of a console visit and a
      # group whose *alias* has to match a string buried in this file. Groups
      # still work if FIREBASE_TESTER_GROUPS is set; both can be used at once.
      #
      # Testers do not need a Google account or a registered device — they get
      # an email invite and install through Firebase's App Tester app. That is
      # the whole reason Android distribution is cheap and iOS is not.
      - name: Distribute to testers
        if: ${{ env.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ github.event.inputs.testers && format('{0},{1}', vars.FIREBASE_TESTERS, github.event.inputs.testers) || vars.FIREBASE_TESTERS }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS }}
          releaseNotes: ${{ github.event.inputs.release_notes || github.event.head_commit.message }}
          file: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  # The same Flutter widget tree, compiled for the browser.
  #
  # Not a deliverable — the APK is. This exists so the app can be looked at
  # and clicked through without an Android device, an emulator, or the ~4GB of
  # toolchain either implies: the artifact is a few MB of static files that
  # open in any browser. Useful for a reviewer, and useful for checking a UI
  # change without waiting on an APK install.
  web-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the web platform scaffolding
        run: |
          flutter create --org com.slipstream --project-name slipstream \
            --platforms=web /tmp/scaffold-web
          cp -r /tmp/scaffold-web/web ./web

      - run: flutter pub get

      - name: Resolve the API origin
        run: |
          API_URL="${{ github.event.inputs.api_url || vars.API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::No API origin. Set the API_URL repository variable, or pass api_url when running this workflow manually."
            exit 1
          fi
          # 10.0.2.2 is the Android emulator's alias for the host machine's
          # loopback. It means nothing in a desktop browser, so a web build
          # compiled with it would fail every request for a reason that looks
          # like a bug in the app. Translate it back to localhost here.
          case "$API_URL" in
            *10.0.2.2*) API_URL="${API_URL//10.0.2.2/localhost}"
                        echo "::notice::Rewrote the emulator alias to $API_URL for the web build." ;;
          esac
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      # `--base-href /` keeps the build openable straight from disk or from
      # any static host, rather than assuming a subdirectory.
      - run: flutter build web --release --base-href / --dart-define=API_URL=$API_URL

      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-flutter-web
          path: apps/mobile/build/web
